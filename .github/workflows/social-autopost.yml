name: Pubblica nuovi articoli sui social

on:
  schedule:
    - cron: '7,37 * * * *' # ogni mezz'ora (GitHub può ritardare di qualche minuto)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Solo simulazione (non pubblica niente)'
        type: boolean
        default: false
      test_site:
        description: 'Prova manuale (non registra nulla). Scegli cosa provare, oppure "nessuna prova" per il normale giro.'
        type: choice
        options:
          - nessuna prova
          - facebook-controllo-sf
          - facebook-pubblica-sf
          - telegram-sf
          - facebook-controllo-tie
          - facebook-pubblica-tie
          - telegram-tie
        default: nessuna prova

permissions:
  contents: write # serve per salvare l'elenco degli articoli già pubblicati

concurrency:
  group: social-autopost
  cancel-in-progress: false

jobs:
  autopost:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pubblica
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }} # tutte le chiavi, con prefisso del sito (TIE_..., SF_...)
          TEST_SITE: ${{ inputs.test_site }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$TEST_SITE" != "nessuna prova" ] && [ -n "$TEST_SITE" ]; then
            node autopost.mjs --test="${TEST_SITE%-*}" --site="${TEST_SITE##*-}"
          elif [ "$DRY_RUN" = "true" ]; then node autopost.mjs --dry-run
          else node autopost.mjs; fi
      - name: Salva l'elenco dei già pubblicati
        if: always() && !inputs.dry_run && (inputs.test_site == '' || inputs.test_site == 'nessuna prova')
        run: |
          git config user.name "autopost-bot"
          git config user.email "autopost-bot@users.noreply.github.com"
          git add state
          git diff --cached --quiet || (git commit -m "autopost: aggiorna elenco articoli pubblicati" && git pull --rebase && git push)
